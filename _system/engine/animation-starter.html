<!doctype html>
<!-- animation-starter.html: a working page for _system/engine/render_frames.mjs. Copy it into projects/_work/<name>/anim.html and replace the scenes.
     RULES: render(t) is a PURE function of t (seconds). No timers, no requestAnimationFrame, no Date, no Math.random, no CSS transitions.
     Everything below moves: entrances (pop), constant motion (bob / pulse / drift), drawn-on effects (line, bars, clock hand, counter) and scene fades.
     Put every `at` on the START of the spoken word it illustrates (from words.json / the voice alignment), not on a fixed rhythm.
     Look at stills first:  node _system/engine/render_frames.mjs --page=anim.html --times=0.5,2,4,7 --frames-dir=stills
     Then the video:        node _system/engine/render_frames.mjs --page=anim.html --dur=9 --out=silent.mp4
     Then check it moves:   python _system/engine/motion_check.py silent.mp4 -->
<html><head><meta charset="utf-8">
<style>
:root{--bg:#F5EFE6;--ink:#111;--y:#FFC93C;--t:#1AA390;--p:#6C4CE0;--r:#FF4B2B}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:"Segoe UI","Noto Sans Thai",Arial,sans-serif}
#stage{position:relative;width:1080px;height:1920px}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.pill{position:absolute;left:50%;padding:14px 40px;border:5px solid var(--ink);border-radius:60px;font-weight:800;font-size:56px;white-space:nowrap}
.y{background:var(--y)}.t{background:var(--t);color:#fff}
.bar{position:absolute;bottom:0;width:150px;border:5px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0}
svg{overflow:visible}
</style></head><body>
<div id="stage">
  <!-- SCENE A: 0 - 4.5 s -->
  <div class="scene" id="A">
    <div class="pill y" id="a_title" style="top:150px">Brain + insulin</div>
    <svg class="abs" id="a_brain" style="left:290px;top:520px" width="500" height="400" viewBox="0 0 400 320">
      <path d="M200 40 C150 10 80 30 70 90 C20 100 10 170 50 200 C30 250 80 300 140 280 C170 310 230 310 260 280 C320 300 380 250 350 200 C390 170 380 100 330 90 C320 30 250 10 200 40Z" fill="#F7B7C8" stroke="#111" stroke-width="8"/>
    </svg>
    <div class="abs" id="a_dots" style="left:0;top:0"></div>
    <div class="pill t" id="a_sub" style="top:1050px">fuel for thinking</div>
  </div>
  <!-- SCENE B: 4.5 - 9 s -->
  <div class="scene" id="B">
    <div class="pill y" id="b_title" style="top:150px">It builds up</div>
    <div class="abs" id="b_chart" style="left:140px;top:420px;width:800px;height:520px;border-left:6px solid #111;border-bottom:6px solid #111">
      <div class="bar" id="b_bar1" style="left:60px;background:var(--t)"></div>
      <div class="bar" id="b_bar2" style="left:300px;background:var(--y)"></div>
      <div class="bar" id="b_bar3" style="left:540px;background:var(--r)"></div>
      <svg class="abs" style="left:0;top:0" width="800" height="520" viewBox="0 0 800 520"><path id="b_line" d="M20 480 C200 420 300 300 460 250 C600 210 680 120 780 40" fill="none" stroke="#6C4CE0" stroke-width="12" stroke-linecap="round"/></svg>
    </div>
    <svg class="abs" style="left:380px;top:1080px" width="320" height="320" viewBox="0 0 320 320"><circle cx="160" cy="160" r="140" fill="#fff" stroke="#111" stroke-width="10"/><line id="b_hand" x1="160" y1="160" x2="160" y2="50" stroke="#FF4B2B" stroke-width="14" stroke-linecap="round" style="transform-origin:160px 160px"/><circle cx="160" cy="160" r="14" fill="#111"/></svg>
    <div class="abs" id="b_count" style="left:0;right:0;top:1480px;text-align:center;font-weight:800;font-size:150px">0%</div>
  </div>
</div>
<script>
/* ---------- helpers (all pure) ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, t0, d) => clamp((t - t0) / d);                       // 0..1 progress of an effect that starts at t0 and lasts d seconds
const outBack = (p, s = 1.9) => { p -= 1; return p * p * ((s + 1) * p + s) + 1; };   // overshoot
const outCubic = p => 1 - Math.pow(1 - p, 3);
const bob = (t, amp, speed = 1, ph = 0) => Math.sin((t * speed + ph) * Math.PI * 2) * amp;   // constant motion
const $ = id => document.getElementById(id);

// entrance: pops in at t0 with overshoot + a small rise. Returns opacity/scale/lift for time t.
const pop = (t, t0, d = 0.35) => { const p = prog(t, t0, d), e = outBack(p); return { o: clamp(p * 3), s: 0.6 + 0.4 * e, y: (1 - outCubic(p)) * 40 }; };
function place(el, t, t0, extra = '') { const q = pop(t, t0); el.style.opacity = q.o; el.style.transform = `${extra} translateY(${q.y}px) scale(${q.s})`; }

/* ---------- the scenes: start / end in seconds, and a draw(t) for each ---------- */
const SCENES = [
  { id: 'A', start: 0, end: 4.5, draw(t) {
      const c = t - this.start;
      place($('a_title'), c, 0.2, 'translateX(-50%)');
      const b = $('a_brain'); const q = pop(c, 0.8);
      b.style.opacity = q.o; b.style.transform = `translateY(${q.y + bob(c, 14, 0.7)}px) scale(${q.s * (1 + 0.025 * Math.sin(c * 5))})`;   // bobs + pulses all the time
      place($('a_sub'), c, 2.2, 'translateX(-50%)');
      // dots flow towards the brain: positions are a function of t (no Math.random: a fixed table)
      let h = ''; for (let i = 0; i < 12; i++) { const ph = (c * 0.5 + i / 12) % 1, x = 90 + i * 85 + 0 * ph, y = 1000 - ph * 480; h += `<div class="abs" style="left:${(x * (1 - ph) + 540 * ph) | 0}px;top:${y | 0}px;width:26px;height:26px;border-radius:50%;background:var(--y);border:4px solid #111;opacity:${(1 - ph) * 0.9 + 0.1}"></div>`; }
      $('a_dots').innerHTML = h;
  } },
  { id: 'B', start: 4.5, end: 9, draw(t) {
      const c = t - this.start;
      place($('b_title'), c, 0.2, 'translateX(-50%)');
      [['b_bar1', 0.6, 180], ['b_bar2', 1.0, 300], ['b_bar3', 1.4, 440]].forEach(([id, t0, h]) => { $(id).style.height = (h * outCubic(prog(c, t0, 0.9))) + 'px'; });   // bars GROW
      const L = $('b_line'), len = L.getTotalLength(); L.style.strokeDasharray = len; L.style.strokeDashoffset = len * (1 - outCubic(prog(c, 1.8, 1.4)));      // line is DRAWN
      $('b_hand').style.transform = `rotate(${prog(c, 1.0, 3.0) * 300}deg)`;                                                                              // clock hand turns
      $('b_count').textContent = Math.round(87 * outCubic(prog(c, 2.0, 1.8))) + '%';                                                                       // number counts up
  } },
];

/* ---------- render(t): the one function the renderer calls ---------- */
const FADE = 0.35;   // seconds of cross-fade at every scene change
function render(t) {
  for (const s of SCENES) {
    const el = $(s.id), inT = prog(t, s.start, FADE), outT = 1 - prog(t, s.end - FADE, FADE);
    const on = t >= s.start && t < s.end + 0.0001;
    el.style.opacity = on ? Math.min(inT, outT) : 0;
    if (on) s.draw(t);
  }
}
window.render = render;
document.fonts.ready.then(() => { window.ready = true; });
</script></body></html>
